# The deployment overlay: TLS at the edge, and every secret from a file.
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# Two things change from the base stack, and both are the difference between
# something that runs and something that can be exposed.
#
# **Secrets arrive as files, not environment variables.** An environment
# variable is visible to `docker inspect`, to anything that can read
# /proc/<pid>/environ, and to every child process the container ever spawns.
# Compose mounts each of these read-only under /run/secrets, and the
# application is told the path rather than the value -- see FileSecretsSource
# in core/config.py. Naming a secret both ways is a startup error rather than a
# silent preference, because an operator who has set both believes they have
# rotated something they have not.
#
# **The edge terminates TLS.** nginx serves 8443 and answers 8080 with a
# permanent redirect and nothing else. The API keeps listening on plain HTTP,
# unpublished, reachable only across the compose bridge.

name: deeptrace

secrets:
  jwt_secret:
    file: ./deploy/secrets/jwt_secret
  google_api_key:
    file: ./deploy/secrets/google_api_key
  tavily_api_key:
    file: ./deploy/secrets/tavily_api_key
  postgres_password:
    file: ./deploy/secrets/postgres_password
  # The whole URL, not just the password, because a connection string cannot be
  # assembled from a file by compose interpolation. `make secrets` writes this
  # and postgres_password together from one generated password, so the two
  # cannot disagree -- which they otherwise would, on the first rotation.
  database_url:
    file: ./deploy/secrets/database_url

networks:
  default:
    ipam:
      config:
        # Pinned so the API can be told exactly which address to trust
        # X-Forwarded-For from. Compose would otherwise allocate a subnet per
        # environment, and the alternative to naming one is `*` -- which lets
        # any client claim any address and turns the rate limiter into a
        # counter of numbers the attacker chose.
        - subnet: 172.28.0.0/16

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deeptrace}
      POSTGRES_DB: ${POSTGRES_DB:-deeptrace}
      # The image's own file convention. Setting POSTGRES_PASSWORD as well
      # would be the same ambiguity this overlay exists to remove.
      POSTGRES_PASSWORD:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  migrate:
    environment:
      DATABASE_URL:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url

  api:
    command:
      - python
      - -m
      - core.cli
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Without this the rate limiter counts every request on the internet
      # against one bucket, because behind a proxy the socket's peer address is
      # the proxy. Scoped to the compose subnet: uvicorn rewrites the client
      # address from X-Forwarded-For only for connections that arrive from
      # there, so a header set by an outside client is ignored.
      - --forwarded-allow-ips
      - 172.28.0.0/16
    environment: &deploy_env
      # Emptied, so the base file's ${VAR:?} interpolation is not required and
      # cannot win. Each is supplied by the file beside it.
      JWT_SECRET:
      GOOGLE_API_KEY:
      TAVILY_API_KEY:
      DATABASE_URL:
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      GOOGLE_API_KEY_FILE: /run/secrets/google_api_key
      TAVILY_API_KEY_FILE: /run/secrets/tavily_api_key
      DATABASE_URL_FILE: /run/secrets/database_url
      APP_ENV: production
      JSON_LOGS: "true"
    secrets: &deploy_secrets
      - jwt_secret
      - google_api_key
      - tavily_api_key
      - database_url

  worker:
    environment: *deploy_env
    secrets: *deploy_secrets

  web:
    ports:
      # 8080 still answers, and answers only with a redirect to 8443. Closing
      # it instead would leave a client that typed the bare hostname with a
      # connection refused rather than a working link.
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      # The TLS server file ships inside the image; this activates it. Mounting
      # the copy from the image itself means there is no second source of truth
      # on the host to drift from what was built and tested.
      - ./apps/web/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Against the redirect on 8080 rather than the TLS port: a deployment
      # certificate is issued for a hostname, and `wget https://localhost`
      # inside the container fails hostname verification for a stack that is
      # working perfectly. --spider stops wget following the redirect out to a
      # name that does not resolve in here.
      test: ["CMD-SHELL", "wget -q -S --spider --max-redirect=0 http://localhost:8080/ 2>&1 | grep -q ' 301'"]
      interval: 10s
      timeout: 5s
      retries: 5
