[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeptrace"
version = "0.1.0"
description = "Autonomous AI Research & Evidence Synthesis Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manan Ghodasara" }]
keywords = ["ai", "agents", "research", "llm", "evidence", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ---------------------------------------------------------------------------
# Milestone 0 ships only what the foundation needs: typed configuration and
# structured logging. Provider SDKs, orchestration, and persistence arrive with
# the milestones that actually use them, so every dependency here has a caller.
# ---------------------------------------------------------------------------
dependencies = [
    "pydantic>=2.9",          # structured outputs and schema validation
    "pydantic-settings>=2.6", # typed, environment-backed configuration
    "structlog>=24.4",        # structured logging for the trace requirement
    "google-genai>=1.0",      # Gemini provider adapter (core/llm/gemini.py)
    "httpx>=0.27",            # async HTTP for the search and fetch tools
    "selectolax>=0.3",        # fast, deterministic HTML text extraction
    "sqlalchemy[asyncio]>=2.0",  # async ORM for durable research state
    "asyncpg>=0.29",          # PostgreSQL driver used by the async engine
    "alembic>=1.13",          # schema migrations
    "langgraph>=1.0",         # stateful, checkpointed research workflow
    "langgraph-checkpoint-postgres>=2.0",  # durable checkpoints (brings psycopg3)
    "redis>=5.0",             # job queue and progress fan-out (asyncio client)
    "fastapi>=0.115",         # HTTP API over the research engine
    "uvicorn[standard]>=0.32", # ASGI server for the API
]

[project.optional-dependencies]
# Provider SDKs are optional extras. The core package runs with any one of
# them, which is what keeps the vendor-neutral interface honest -- installing
# DeepTrace does not force a particular vendor's SDK into the environment.
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",   # the workflow layer is async end to end
    "pytest-cov>=6.0",
    "ruff>=0.8",              # linter and formatter in one tool
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/purpoint/DeepTrace"

[project.scripts]
deeptrace = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps", "infrastructure"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs and design problems
    "C4",  # comprehension simplifications
    "UP",  # pyupgrade: modern syntax
    "ARG", # unused arguments
    "SIM", # simplifications
    "PTH", # prefer pathlib over os.path
    "RUF", # ruff-specific rules
    "S",   # bandit security rules -- this project fetches untrusted URLs
]
ignore = [
    "E501", # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and hardcoded sample credentials/URLs.
"tests/**/*.py" = ["S101", "S105", "S106", "ARG001", "ARG002"]
# Migration scripts are generated by Alembic. Reformatting them on every
# autogenerate would produce diffs that say nothing about the schema change.
"infrastructure/db/migrations/versions/*.py" = ["W291", "W293", "E501", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["core", "apps", "infrastructure"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: fast tests with no external dependencies",
    "integration: requires PostgreSQL or Redis",
    "workflow: exercises the full LangGraph research workflow",
    "evaluation: runs against the benchmark dataset",
    "llm: makes real LLM API calls and costs money -- deselected by default",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["core", "apps", "infrastructure"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
