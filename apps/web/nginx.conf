# Serving the client, and proxying the API to the same origin.

upstream deeptrace_api {
    # The compose service name. Docker's embedded DNS resolves it, and using
    # the name rather than an address means the API can be restarted or moved
    # without touching this file.
    server api:8000;
}

server {
    listen 8080;
    server_name _;

    # Retrieved web content reaches the DOM in this application, so the report
    # renderer sanitizes it. These are the layer underneath that: even if
    # something slipped through, the browser is told not to execute it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No inline scripts are emitted by the Vite build, so 'unsafe-inline' is not
    # needed for script-src. Styles do need it -- the bundler inlines critical
    # CSS -- which is stated rather than quietly widened to cover both.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API, on this origin under /api. The client is built against this
    # path, and the dev server proxies the same way.
    location /api/ {
        proxy_pass http://deeptrace_api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The WebSocket upgrade. Without these three lines the progress stream
        # fails at the handshake with a 400 and every run shows a spinner that
        # never moves -- while every other endpoint works perfectly, which is
        # what makes it a confusing failure rather than an obvious one.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A research stream is idle between model calls. nginx's default read
        # timeout is sixty seconds, which would close a live progress socket
        # in the middle of a run that is working correctly.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Progress events are pushed as they happen; buffering them defeats the
        # point of streaming them.
        proxy_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        # A single-page application: every unknown path is a client route, not
        # a missing file. Without this, reloading /research/res_abc is a 404.
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever their contents do, so they can be
    # cached indefinitely. index.html must not be, or a deploy is invisible
    # until every browser's cache expires.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
