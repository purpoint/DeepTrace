# Serving the client, and proxying the API to the same origin. Plain HTTP.
#
# This is the local and CI configuration: one origin, no certificate to manage.
# A deployment mounts nginx.tls.conf over this file instead -- see
# docker-compose.tls.yml. Everything below the server block is shared between
# the two, so they cannot drift.

upstream deeptrace_api {
    # The compose service name. Docker's embedded DNS resolves it, and using
    # the name rather than an address means the API can be restarted or moved
    # without touching this file.
    server api:8000;
}

# No HSTS without TLS. The shared header snippet emits
# Strict-Transport-Security from this variable, and nginx omits an add_header
# whose value is empty, so mapping it to "" here switches it off for every
# response this file serves.
map $scheme $hsts_header {
    default "";
}

server {
    listen 8080;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/app.conf;
}
