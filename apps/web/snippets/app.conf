# What the application serves, independent of how the connection was secured.
#
# Included by both server files -- the plain-HTTP one used locally and the TLS
# one used in a deployment -- so a change to the proxy or the cache policy
# cannot land in one and be forgotten in the other. Two copies of a config that
# must agree is a diff nobody runs.

# The API, on this origin under /api. The client is built against this
# path, and the dev server proxies the same way.
location /api/ {
    proxy_pass http://deeptrace_api/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The scheme the *client* used, which is what the application must know:
    # over TLS this says https even though the hop to the API is plain http
    # inside the compose network.
    proxy_set_header X-Forwarded-Proto $scheme;

    # The WebSocket upgrade. Without these three lines the progress stream
    # fails at the handshake with a 400 and every run shows a spinner that
    # never moves -- while every other endpoint works perfectly, which is
    # what makes it a confusing failure rather than an obvious one.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # A research stream is idle between model calls. nginx's default read
    # timeout is sixty seconds, which would close a live progress socket
    # in the middle of a run that is working correctly.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Progress events are pushed as they happen; buffering them defeats the
    # point of streaming them.
    proxy_buffering off;
}

location / {
    root /usr/share/nginx/html;
    # A single-page application: every unknown path is a client route, not
    # a missing file. Without this, reloading /research/res_abc is a 404.
    try_files $uri $uri/ /index.html;
}

# Hashed asset filenames change whenever their contents do, so they can be
# cached indefinitely. index.html must not be, or a deploy is invisible
# until every browser's cache expires.
location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
}
