# Security response headers, in a file because nginx will not inherit them.
#
# `add_header` is inherited from an outer level *only if the current level
# defines no add_header of its own*. That rule is unusual, silent, and the
# reason this file exists: `location /assets/` sets Cache-Control with
# add_header, which dropped every one of these headers from every script and
# stylesheet the application serves -- the exact responses a content-injection
# policy is written to constrain. The server block still listed them, so the
# configuration read as though the policy were in force.
#
# Included at the server level and again inside every location that sets a
# header of its own. A control applied in three places out of four reviews as
# a control that exists.

# Retrieved web content reaches the DOM in this application, so the report
# renderer sanitizes it. These are the layer underneath that: even if something
# slipped through, the browser is told not to execute it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No inline scripts are emitted by the Vite build, so 'unsafe-inline' is not
# needed for script-src. Styles do need it -- the bundler inlines critical
# CSS -- which is stated rather than quietly widened to cover both.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

# HSTS, but only where it means anything. $hsts_header is mapped from the
# scheme by whichever server file is in use, and resolves to the empty string
# over plain HTTP -- nginx omits an add_header whose value is empty. Sending
# HSTS over HTTP is ignored by browsers anyway; the reason not to is that a
# header present in a response nobody honours reads, to the next person, as
# protection that is switched on.
add_header Strict-Transport-Security $hsts_header always;
