# Serving the client over TLS, and redirecting everything that is not.
#
# Mounted over conf.d/default.conf by docker-compose.tls.yml. It shares the
# proxy, caching and header rules with the plain-HTTP file through the same two
# snippets, so the only thing that differs here is the transport.
#
# Termination happens at this hop and nowhere else. The API listens on plain
# HTTP inside the compose network, which is not published to the host at all --
# encrypting that hop would mean issuing and rotating certificates for internal
# service names to protect traffic that never leaves the bridge.

upstream deeptrace_api {
    server api:8000;
}

# HSTS, on, because this file only ever serves https. One year with
# includeSubDomains, and deliberately *without* preload: preload is a
# submission to a list baked into browser binaries, and getting off it takes
# months. It is the right end state and the wrong thing to switch on in the
# same commit that first serves a certificate.
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Everything on plain HTTP is redirected, and nothing else is served there.
# A stack that answers on both is one where a client that forgot the scheme
# keeps working, so nobody finds out the credential travelled in clear.
server {
    listen 8080;
    server_name _;

    # The one path that is not redirected, so a health check can reach it.
    #
    # BusyBox wget -- which is the only wget in nginx:alpine -- has no
    # --max-redirect, and --spider follows a 301. Pointed at "/" it therefore
    # chased the redirect to https://localhost, found nothing listening on 443
    # inside the container, and reported the service unhealthy while it was
    # serving correctly. Serving one fixed string here is the ordinary answer:
    # it is what a load balancer probes, it discloses nothing, and it does not
    # move when the application changes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # In `location /`, not at server level. A server-level `return` runs in the
    # rewrite phase, *before* nginx picks a location -- so it wins over an exact
    # `location = /healthz` match and the health path above becomes dead
    # configuration that reads as though it works. That is exactly what
    # happened: every probe was redirected to port 443, where nothing listens
    # inside the container, and the container reported unhealthy while serving
    # the internet correctly.
    #
    # 301, not 302. A permanent redirect is cached by the browser, so the
    # second request never leaves as plain HTTP at all.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 have no ciphers worth negotiating and
    # are refused by current browsers regardless; listing them would only
    # matter for a client that should not be trusted with this data anyway.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Off, which is the current recommendation and not an oversight: with only
    # AEAD suites left on the list, the client is the side that knows whether
    # it has AES hardware acceleration, and it should pick.
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Off. Session tickets are encrypted with a key nginx generates at start
    # and never rotates, so a ticket recovered later decrypts a session that
    # was recorded earlier -- forward secrecy, given away to save a handshake.
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/app.conf;
}
